# Apple-style (iOS / iPadOS 27 language) light theme: grouped background,
# white cards, system colours, capsule buttons. Fine detail lives in
# portal/components/common.py (CSS).
[theme]
base = "light"
primaryColor = "#007AFF"
backgroundColor = "#F2F2F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1D1F"
linkColor = "#007AFF"
linkUnderline = false
borderColor = "#E5E5EA"
dataframeBorderColor = "#EDEDF0"
dataframeHeaderBackgroundColor = "#F7F7F9"
showWidgetBorder = false
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "full"
baseFontSize = 15
codeBackgroundColor = "#F5F5F7"
codeFontSize = "0.82rem"
metricValueFontWeight = 600
blueColor = "#007AFF"
greenColor = "#34C759"
redColor = "#FF3B30"
orangeColor = "#FF9500"
yellowColor = "#FFCC00"
violetColor = "#5856D6"
grayColor = "#8E8E93"

[theme.sidebar]
backgroundColor = "#FBFBFD"
secondaryBackgroundColor = "#F2F2F7"

[server]
headless = true
port = 8501
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
